<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speak&amp;Teach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;700&family=Unbounded:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* Student: home with groups and lessons; player with the task and a Notes panel */
  body{display:flex;flex-direction:column;min-height:100%}
  .top{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:600;font-size:15px}
  .top .me{margin-left:auto;font-size:13px;color:var(--muted)}
  .home{max-width:820px;width:100%;margin:0 auto;padding:28px 16px 60px;display:flex;flex-direction:column;gap:28px}
  .hello h1{font-size:24px}
  .gsec{display:flex;flex-direction:column;gap:10px}
  .gsec h2{font-size:17px}
  .exlist a.exname{color:var(--ink);text-decoration:none;font-weight:500}
  .exlist a.exname:hover{color:var(--sel)}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:26px 20px;text-align:center;color:var(--muted)}
  .player{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;height:calc(100vh - 47px);height:calc(100dvh - 47px)}
  .player.nonotes{grid-template-columns:minmax(0,1fr)}
  .pmain{display:flex;flex-direction:column;min-width:0;min-height:0}
  .pbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .pbar .pt{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}
  .pframe{flex:1;border:0;width:100%;background:var(--bg);min-height:0}
  .npanel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:12px;gap:8px;min-height:0}
  .npanel h2{font-size:15px;flex:1}
  .nhead{display:flex;align-items:center;gap:8px}
  @media (max-width:860px){
    .player,.player.nonotes{grid-template-columns:1fr}
    .npanel{position:fixed;left:0;right:0;bottom:0;height:min(70vh,560px);border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);z-index:20;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  }

  .top{background:rgba(255,253,247,.85)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1.5px solid!important;border-image:var(--leak) 1!important}
  .brand{font-family:var(--display);font-weight:500;letter-spacing:-.02em}
  .hello h1{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.03em}
  .home{position:relative}
  body{background:var(--grain),linear-gradient(180deg,#FBF8EF 0%,#FBF8EF 55%,#F7E9C2 100%) fixed}
  .gsec h2{font-family:var(--display);font-weight:500;font-size:17px}
  .stabs,.wfilter{display:flex;gap:4px;background:rgba(255,253,247,.7);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start;flex-wrap:wrap}
  .stabs button,.wfilter button{border:none;background:none;border-radius:999px;padding:7px 14px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
  .stabs button.on,.wfilter button.on{background:var(--leak-fill);color:var(--ink)}
  .wfilter button{font-size:13px;padding:5px 12px}
  #cab{display:flex;flex-direction:column;gap:14px}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .wcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
  .wcard .wtop{display:flex;align-items:flex-start;gap:8px}
  .wcard .ww{flex:1;font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
  .wcard.used .ww{text-decoration:line-through;text-decoration-color:#E6B54A;text-decoration-thickness:2px;color:var(--muted)}
  .wcard .wex{width:100%;resize:vertical;font-size:14px;border-radius:12px}
  .wcard .wused{display:flex;gap:6px;align-items:center;font-size:13px}
  .wcard .wfrom{font-size:11px;color:var(--muted)}
  .wdel,.icard button{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
  .igrid{columns:3 240px;column-gap:12px}
  .icard{break-inside:avoid;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
  .icard img{width:100%;border-radius:12px;margin-bottom:8px;display:block}
  .icard p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
  .icard .inote{font-weight:600}
  .icard .isrc{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
  .icard .ifoot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
  .hello h1{font-weight:300!important}
  .top .brand{width:118px;flex:none}
  .top{gap:14px;flex-wrap:nowrap}
  .top .stabs{align-self:center;padding:3px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .top .stabs button{padding:6px 12px;font-size:13px;white-space:nowrap}
  .top .me{white-space:nowrap}
  .home{padding-top:22px}
  @media (max-width:640px){.top{gap:8px;padding:8px 10px}.top .brand{width:84px}.top .me{display:none}.top .stabs button{padding:6px 9px}.mystars span{display:none}.mystars{padding:0 9px}}
  .mystars{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;background:linear-gradient(135deg,#FFF6D6,#F8D270);color:#4A3B10;font-size:14px;margin-left:auto}
  .mystars span{font-size:12px;opacity:.75}
  .mystars + #logout{margin-left:0}
  .gsec h2,.wcard .ww{font-weight:400!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand" aria-label="Speak&amp;Teach"><span data-logo="1"></span></div>
  <nav class="stabs" id="stabs"></nav>
  <span class="me" id="me"></span>
  <span class="mystars" id="myStars" hidden title="Your stars and points — only you see them"></span>
  <button class="btn ghost sm" id="logout" type="button">Sign out</button>
</header>

<div class="home" id="home"></div>

<div class="player nonotes" id="player" hidden>
  <div class="pmain">
    <div class="pbar">
      <a class="btn sm" href="#" id="back">← All lessons</a>
      <span class="pt" id="ptitle"></span>
      <button class="btn sm" id="notesBtn" type="button">Notes</button>
    </div>
    <iframe class="pframe" id="frame" title="Task"></iframe>
  </div>
  <aside class="npanel" id="npanel" hidden>
    <div class="nhead"><h2>My notes</h2><button class="btn ghost sm" id="nclose" type="button">Hide</button></div>
    <p class="small muted" style="margin:0">Private notes for this task. Only you and your teacher can see them.</p>
    <div id="notes" style="display:flex;flex:1;min-height:0"></div>
  </aside>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/static/common.js"></script>
<script>
var S = null, cur = null, openLessons = {};
var socket = io();

var notes = makeNotes($('#notes'), {
  placeholder: 'Ideas, new words, questions… Use the toolbar for lists and highlights.',
  onChange: function (html) { if (cur) socket.emit('doc:set', { exerciseId: cur, html: html }); }
});

async function load() { S = await api('GET', '/api/s/state'); $('#me').textContent = S.me.name; route(); }
function findEx(id) { for (var g of S.groups) for (var l of g.lessons) for (var e of l.exercises) if (e.id === id) return { g: g, l: l, e: e }; return null; }
function route() { var m = /^#\/ex\/(\w+)$/.exec(location.hash); if (m && findEx(m[1])) location.replace('/b/' + m[1]); else showHome(); }
window.addEventListener('hashchange', function () { if (S) route(); });

function showHome() {
  cur = null; socket.emit('where', { exerciseId: null });
  $('#player').hidden = true; $('#frame').src = 'about:blank';
  var home = $('#home'); home.hidden = false;
  $('#stabs').innerHTML = [['lessons', 'Boards'], ['words', 'My words'], ['ideas', 'Idea bank']].map(function (t) { return '<button type="button" data-st="' + t[0] + '" class="' + (homeTab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('');
  var h = '';
  if (homeTab !== 'lessons') { home.innerHTML = h + '<div id="cab"><p class="muted">Loading…</p></div>'; loadCab(); return; }
  if (!S.groups.length) h += '<div class="empty">Your teacher hasn\'t opened any boards for you yet.</div>';
  // как в Miro: группа — и сразу её доски; доска открывается во всё окно
  S.groups.forEach(function (g) {
    var all = []; g.lessons.forEach(function (l) { l.exercises.forEach(function (e) { all.push(e); }); });
    h += '<section class="gsec"><h2>' + esc(g.name) + '</h2>';
    h += all.length ? '<div class="bgrid">' + all.map(function (e) {
      var p = S.progress[e.id];
      var chip = p && p.total ? '<span class="chipnum' + (p.correct === p.total ? ' done' : '') + '">' + (p.correct || p.wrong ? '✓ ' + p.correct + ' / ' + p.total : p.filled + ' / ' + p.total) + '</span>' : '';
      return boardCard(e, '/b/' + e.id, chip);
    }).join('') + '</div>' : '<p class="muted small">No boards yet.</p>';
    h += '</section>';
  });
  home.innerHTML = h;
}
/* My words and Idea bank */
var homeTab = 'lessons', CAB = null, wordFilter = 'all';
try { homeTab = localStorage.getItem('klass.htab') || 'lessons'; } catch (e) {}
document.addEventListener('click', function (e) { var b = e.target.closest('[data-st]'); if (b) { homeTab = b.dataset.st; try { localStorage.setItem('klass.htab', homeTab); } catch (err) {} showHome(); } });
async function loadCab() { try { CAB = await api('GET', '/api/s/cabinet'); renderCab(); renderStars(); } catch (e) { toast(e.message); } }
function renderStars() { var c = $('#myStars'); if (!c || !CAB || !CAB.stars) return; c.hidden = false; c.innerHTML = '⭐ <b>' + CAB.stars.stars + '</b><span>' + CAB.stars.pts + ' pts</span>'; }
function renderCab() {
  var box = $('#cab'); if (!box || !CAB) return;
  if (homeTab === 'words') {
    var list = CAB.vocab.filter(function (w) { return wordFilter === 'all' || (wordFilter === 'used' ? w.used : !w.used); });
    box.innerHTML = '<p class="muted">New language from your lessons. Write your own example for each one and tick it when you start using it.</p>' +
      '<form class="row" id="addWord"><input id="newWord" placeholder="Add a word or phrase" maxlength="120"><button class="btn primary" type="submit">Add</button></form>' +
      '<div class="wfilter">' + [['all', 'All · ' + CAB.vocab.length], ['learn', 'To use · ' + CAB.vocab.filter(function (w) { return !w.used; }).length], ['used', 'I use it · ' + CAB.vocab.filter(function (w) { return w.used; }).length]].map(function (f) { return '<button type="button" data-wf="' + f[0] + '" class="' + (wordFilter === f[0] ? 'on' : '') + '">' + f[1] + '</button>'; }).join('') + '</div>' +
      (list.length ? '<div class="wgrid">' + list.map(function (w) {
        return '<div class="wcard' + (w.used ? ' used' : '') + '" data-w="' + w.id + '"><div class="wtop"><b class="ww">' + esc(w.w) + '</b><button class="wdel" type="button" data-wdel="1" aria-label="Delete">×</button></div>' +
          '<textarea class="wex" rows="2" placeholder="My example…">' + esc(w.ex) + '</textarea>' +
          '<label class="wused"><input type="checkbox" data-wused="1"' + (w.used ? ' checked' : '') + '> I use it</label><span class="wfrom">' + esc(w.from || '') + '</span></div>';
      }).join('') + '</div>' : '<div class="empty">' + (CAB.vocab.length ? 'Nothing here.' : 'After a lesson your teacher ends, write your new words in the exit ticket — they appear here.') + '</div>');
  } else {
    box.innerHTML = '<p class="muted">Activities, strategies and ideas you liked. Save anything from a board with the 💡 button.</p>' +
      '<form class="row" id="addIdea"><input id="newIdea" placeholder="Write an idea" maxlength="2000"><button class="btn primary" type="submit">Save</button></form>' +
      (CAB.ideas.length ? '<div class="igrid">' + CAB.ideas.map(function (i) { return '<div class="icard" data-i="' + i.id + '">' + (i.src ? '<img src="' + esc(i.src) + '" alt="">' : '') + (i.note ? '<p class="inote">💡 ' + esc(i.note) + '</p>' : '') + (i.text ? '<p' + (i.note ? ' class="isrc"' : '') + '>' + esc(i.text) + '</p>' : '') + '<div class="ifoot"><span>' + esc(i.from || '') + ' · ' + ago(i.at) + '</span><button type="button" data-idel="1" aria-label="Delete">×</button></div></div>'; }).join('') + '</div>' : '<div class="empty">Your Idea bank is empty for now.</div>');
  }
}
document.addEventListener('click', async function (e) {
  var f = e.target.closest('[data-wf]'); if (f) { wordFilter = f.dataset.wf; renderCab(); return; }
  var wd = e.target.closest('[data-wdel]'); if (wd) { var id = wd.closest('[data-w]').dataset.w; if (confirm('Delete this word?')) { await api('DELETE', '/api/s/vocab/' + id); CAB.vocab = CAB.vocab.filter(function (x) { return x.id !== id; }); renderCab(); } return; }
  var idl = e.target.closest('[data-idel]'); if (idl) { var iid = idl.closest('[data-i]').dataset.i; if (confirm('Delete this idea?')) { await api('DELETE', '/api/s/ideas/' + iid); CAB.ideas = CAB.ideas.filter(function (x) { return x.id !== iid; }); renderCab(); } }
});
document.addEventListener('change', async function (e) {
  var u = e.target.closest('[data-wused]'); if (u) { var id = u.closest('[data-w]').dataset.w, it = CAB.vocab.find(function (x) { return x.id === id; }); it.used = u.checked; await api('PATCH', '/api/s/vocab/' + id, { used: u.checked }); renderCab(); }
});
document.addEventListener('focusout', async function (e) {
  if (!e.target.matches || !e.target.matches('.wex')) return;
  var id = e.target.closest('[data-w]').dataset.w, it = CAB.vocab.find(function (x) { return x.id === id; });
  if (it && it.ex !== e.target.value) { it.ex = e.target.value; try { await api('PATCH', '/api/s/vocab/' + id, { ex: it.ex }); toast('Saved'); } catch (err) { toast(err.message); } }
});
document.addEventListener('submit', async function (e) {
  if (e.target.id === 'addWord') { e.preventDefault(); var w = $('#newWord').value.trim(); if (!w) return; CAB.vocab = await api('POST', '/api/s/vocab', { w: w }); renderCab(); }
  if (e.target.id === 'addIdea') { e.preventDefault(); var t = $('#newIdea').value.trim(); if (!t) return; CAB.ideas = await api('POST', '/api/s/ideas', { text: t, from: 'my own' }); renderCab(); }
});
document.addEventListener('toggle', function (e) { if (e.target.matches && e.target.matches('details.lesson')) openLessons[e.target.dataset.l] = e.target.open; }, true);

function openEx(id) {
  var f = findEx(id); if (!f) return showHome();
  var same = cur === id; cur = id;
  $('#home').hidden = true; $('#player').hidden = false;
  $('#ptitle').textContent = f.l.title + ' · ' + f.e.title;
  document.title = f.e.title + ' · Speak&Teach';
  if (!same) $('#frame').src = '/b/' + id;
  socket.emit('where', { exerciseId: id });
  socket.emit('doc:get', { exerciseId: id }, function (r) { notes.set((r && r.html) || ''); });
}
function setNotes(open) { $('#npanel').hidden = !open; $('#player').classList.toggle('nonotes', !open); try { localStorage.setItem('klass.notes', open ? '1' : ''); } catch (e) {} }
$('#notesBtn').onclick = function () { setNotes($('#npanel').hidden); };
$('#nclose').onclick = function () { setNotes(false); };
try { if (localStorage.getItem('klass.notes') && innerWidth > 860) setNotes(true); } catch (e) {}
$('#back').addEventListener('click', function (e) { e.preventDefault(); location.hash = ''; });
$('#logout').addEventListener('click', async function () { await api('POST', '/api/logout'); location.href = '/'; });

window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || !e.data || e.data.__cls !== 1 || !cur) return;
  if (e.source !== $('#frame').contentWindow) return;
  var snap = e.data.snap;
  socket.emit('progress', { exerciseId: cur, snap: snap });
  var f = snap.fields || [];
  S.progress[cur] = { total: f.length, filled: f.filter(function (x) { return x.v !== ''; }).length, correct: f.filter(function (x) { return x.ok === true; }).length, wrong: f.filter(function (x) { return x.ok === false; }).length };
});
document.addEventListener('visibilitychange', function () { socket.emit('vis', !document.hidden); });

socket.on('connect', function () {
  socket.emit('where', { exerciseId: cur });
  var fr = $('#frame'); try { if (cur && fr.contentWindow) fr.contentWindow.postMessage({ __clsPing: 1 }, location.origin); } catch (e) {}
});
socket.on('connect_error', function (err) { if (err && err.message === 'auth') location.href = '/'; });
socket.on('disconnect', function (reason) { if (reason === 'io server disconnect') location.href = '/'; });
socket.on('goto', async function (d) {
  if (!findEx(d.exerciseId)) { try { S = await api('GET', '/api/s/state'); } catch (e) { return; } }
  if (cur !== d.exerciseId) { location.hash = '#/ex/' + d.exerciseId; toast('Your teacher opened “' + d.title + '”'); }
});
socket.on('doc', function (d) { if (d.exerciseId === cur && d.by === 't') { notes.set(d.html); toast('Your teacher updated your notes'); } else if (d.exerciseId === cur) notes.set(d.html); });
socket.on('refresh', async function () {
  try { S = await api('GET', '/api/s/state'); } catch (e) { return; }
  if (!cur) showHome(); else if (!findEx(cur)) { toast('This task is no longer available'); location.hash = ''; }
  else { var f = findEx(cur); $('#ptitle').textContent = f.l.title + ' · ' + f.e.title; }
});
load().catch(function (e) { toast(e.message); });
api('GET', '/api/s/cabinet').then(function (r) { if (!CAB) CAB = r; renderStars(); }).catch(function () {});
</script>
</body>
</html>
