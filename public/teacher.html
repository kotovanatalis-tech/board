<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speak&amp;Teach · Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;700&family=Unbounded:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* Layout: groups and My boards on the left; the selected space with tabs on the right; a student opens in a side drawer */
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
  .side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:12px}
  .brand{font-weight:600;font-size:15px;padding:0 6px}
  .glist{display:flex;flex-direction:column;gap:1px}
  .gbtn{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:none;border-radius:7px;padding:7px 8px;cursor:pointer;font-size:13px}
  .gbtn:hover{background:var(--soft)}
  .gbtn.cur{background:var(--soft);font-weight:600}
  .gbtn .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gbtn .gc{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .newg{display:flex;gap:6px}
  .newg input{flex:1;font-size:13px}
  .sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;padding:0 6px}
  .sidefoot details summary{cursor:pointer;color:var(--muted)}
  .sidefoot form{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  main{padding:24px 28px 60px;min-width:0}
  .gh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .gh h1{font-size:22px;overflow-wrap:anywhere}
  .gh .acts{margin-left:auto;display:flex;gap:6px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
  .tab.cur{color:var(--ink);border-bottom-color:var(--ink)}
  .tab .n{font-size:11px;background:var(--okbg);color:var(--ok);border-radius:999px;padding:1px 7px;margin-left:5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input{flex:1 1 180px}
  .row input[type=checkbox]{flex:none}
  .stack{display:flex;flex-direction:column;gap:12px}
  .hint{font-size:12px;color:var(--muted);max-width:72ch;margin:0}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:26px 20px;text-align:center;color:var(--muted)}
  .lfoot{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
  .copyrow{flex-basis:100%}
  .copyrow select{flex:1 1 220px}
  .livebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .livebar select{flex:1 1 240px;max-width:460px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;cursor:pointer;min-width:0;font-size:13px}
  .card:hover{border-color:var(--muted)}
  .card.off{opacity:.6}
  .card.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
  .ctop{display:flex;align-items:center;gap:8px}
  .ctop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
  .cex{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)} .bar .b-fill{background:var(--mustard)}
  .cnums{font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
  .cnums .g{color:var(--ok)} .cnums .r{color:var(--bad)}
  .cact{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pos{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .pos .track{flex:1;height:3px;background:var(--soft);border-radius:2px;position:relative}
  .pos .track i{position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
  td .row{flex-wrap:nowrap}
  .cred{background:var(--okbg);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .cred pre{margin:0;font:inherit;white-space:pre-wrap;flex:1;min-width:200px}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .libcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .libcard h3{font-size:15px;overflow-wrap:anywhere}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .dh h2{font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
  .dbody{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px;flex:1}
  .dsec{display:flex;flex-direction:column;gap:8px}
  .anslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .anslist li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--soft);font-size:13px}
  .anslist li.here{background:color-mix(in srgb,var(--mustard) 14%,transparent)}
  .anslist .no{color:var(--muted);font-variant-numeric:tabular-nums}
  .anslist .ctx{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
  .anslist .v{font-weight:600;overflow-wrap:anywhere}
  .anslist .v.e{font-weight:400;color:var(--idle)}
  .mark{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;align-self:start}
  .mark.ok{background:var(--okbg);color:var(--ok)} .mark.bad{background:var(--badbg);color:var(--bad)}
  .log{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:150px;overflow-y:auto}
  .log time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
  #dNotes{display:flex;min-height:240px}
  .gc.req{background:#C2412D;color:#fff;border-radius:999px;padding:1px 7px}
  .crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
  .crumbs button{background:none;border:none;padding:3px 6px;border-radius:6px;cursor:pointer;color:var(--muted);font:inherit}
  .crumbs button:hover{background:var(--soft)}
  .crumbs button.cur{color:var(--ink);font-weight:600}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .fcard:hover{border-color:var(--ink)}
  .fcard .fi{width:22px;height:22px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.6}
  .fcard b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
  .fcard .row{flex-wrap:nowrap}
  .libcard .meta{font-size:12px;color:var(--muted)}
  .reqrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .reqrow .nm{flex:1;min-width:180px}
  .modal{position:fixed;inset:0;background:rgba(20,20,18,.35);display:grid;place-items:center;z-index:40;padding:16px}
  .modal .mbox{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:86vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .modal .chk{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
  .tgqr{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
  .tgqr svg{width:100%;height:100%;display:block}
  .jt td,.jt th{white-space:nowrap}
  .jt td.att{text-align:center;cursor:pointer;user-select:none;font-weight:600}
  .jt td.att:hover{background:var(--soft)}
  .att-p{color:var(--ok)} .att-a{color:var(--muted)} .att-ac{color:var(--bad)}
  .bal{font-weight:700;font-variant-numeric:tabular-nums}
  .bal.low{color:#B7791F} .bal.neg{color:var(--bad)}
  .jt input.num{width:70px}
  .jnew{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
  .jatt{display:flex;flex-wrap:wrap;gap:8px}
  .jatt label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
  .jatt select{font-size:12px;padding:3px 4px}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{border-right:none;border-bottom:1px solid var(--line)}
    .glist{flex-direction:row;flex-wrap:wrap}
    .sidefoot{flex-direction:row;flex-wrap:wrap;align-items:center}
    main{padding:18px 16px 60px}
  }

  .side{background:var(--grain),linear-gradient(170deg,#E3E4CF 0%,#F2EAD2 55%,#F8DC8F 100%)!important;border-right:none!important}
  .brand{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.03em}
  .gbtn{border-radius:14px}
  .gbtn.cur{background:rgba(255,253,247,.75)!important;box-shadow:0 8px 20px -14px rgba(120,95,30,.6)}
  .newg input{background:rgba(255,255,255,.7)}
  .gh h1{font-family:var(--display);font-weight:500;letter-spacing:-.03em}
  .tab.cur{border-bottom:2px solid;border-image:var(--leak) 1;color:var(--ink)}
  .card,.libcard,.fcard,.reqrow{border-radius:18px!important;box-shadow:var(--shadow)}
  .card:hover,.libcard:hover,.fcard:hover{background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--leak) border-box!important;border-color:transparent!important}
  .libcard h3{font-family:var(--display);font-weight:500;font-size:15px}
  .fcard{flex-wrap:wrap}
  .fcard b{flex:1 1 140px;font-family:var(--display);font-weight:500;font-size:15px}
  .fcard .row{flex-basis:100%;justify-content:flex-start;gap:2px;margin-left:24px}
  .modal .mbox{border-radius:22px}
  .modal .mbox h2{font-family:var(--display);font-weight:500}
  .modal label.small{display:flex;flex-direction:column;gap:5px}
  .modal input:not([type=checkbox]),.modal select{width:100%}
  .gh h1{font-weight:300!important}
  .side .brand{width:170px;padding:0 6px}
  .libcard h3,.fcard b,.modal .mbox h2{font-weight:400!important}
  .lnkqr{align-self:center;width:180px;height:180px;padding:8px;background:#fff;border-radius:14px;border:1px solid var(--line)}
  .lnkqr svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" aria-label="Speak&amp;Teach"><span data-logo="1"></span></div>
    <nav class="glist"><button class="gbtn" id="libBtn" type="button"><span class="gn">My boards</span><span class="gc" id="libCount"></span></button>
      <button class="gbtn" id="reqBtn" type="button" hidden><span class="gn">Requests</span><span class="gc req" id="reqCount"></span></button></nav>
    <div class="label" style="padding:0 6px">Groups</div>
    <nav class="glist" id="glist"></nav>
    <form class="newg" id="newGroup">
      <input id="newGroupName" placeholder="New group" aria-label="New group name" maxlength="80">
      <button class="btn sm" type="submit">Add</button>
    </form>
    <div class="sidefoot">
      <span class="muted" id="who"></span>
      <button class="btn ghost sm" id="tgSetBtn" type="button" style="justify-content:flex-start;padding-left:0">Telegram sign-in</button>
      <button class="btn ghost sm" id="moveBtn" type="button" style="justify-content:flex-start;padding-left:0">Full backup / move server</button>
      <details>
        <summary>Change password</summary>
        <form id="pwForm">
          <input id="pwOld" type="password" placeholder="Current password" autocomplete="current-password">
          <input id="pwNew" type="password" placeholder="New password" autocomplete="new-password">
          <button class="btn sm" type="submit">Save</button>
        </form>
      </details>
      <button class="btn ghost sm" id="logout" type="button" style="justify-content:flex-start;padding-left:0">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Student"></aside>

<script src="/socket.io/socket.io.js"></script>
<script src="/static/common.js"></script>
<script>
var S = null, cur = null, tab = 'boards', view = 'group';
var presence = {}, drafts = {}, openLessons = {}, cred = null;
var D = { sid: null, exId: null, follow: true, data: null }, dNotes = null;
try { cur = localStorage.getItem('klass.group'); tab = localStorage.getItem('klass.tab') || 'live'; view = localStorage.getItem('klass.view') || 'group'; } catch (e) {}
var socket = io();

async function load() {
  S = await api('GET', '/api/t/state');
  if (S.guestOnly) { var tb = document.getElementById('tgSetBtn'); if (tb) tb.hidden = true; }
  if (S.storageWarn && !document.getElementById('storWarn')) { var w = document.createElement('div'); w.id = 'storWarn'; w.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:50;max-width:min(640px,92vw);background:#C2412D;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)'; w.innerHTML = '<b>Boards are not saved permanently on this server.</b> In Railway add a <b>Volume</b> to this service with mount path <code>/data</code> — otherwise every update deletes all boards. Download a full backup now (Full backup / move server, bottom left).'; document.body.appendChild(w); }
  S.presence.forEach(function (p) { presence[p.studentId] = p; });
  if (!S.groups.some(function (g) { return g.id === cur; })) cur = S.groups[0] ? S.groups[0].id : null;
  if (!cur && view === 'group' && S.library.length) view = 'lib';
  render();
}
function G() { return S.groups.find(function (g) { return g.id === cur; }); }
function exTitle(id) { var e = S.exercises[id]; return e ? e.title : 'task'; }
function groupExercises(g) { var out = []; g.lessonIds.forEach(function (lid) { var l = S.lessons[lid]; if (l) l.exerciseIds.forEach(function (eid) { if (S.exercises[eid]) out.push({ ex: S.exercises[eid], lesson: l }); }); }); return out; }
function onlineCount(g) { return g.studentIds.filter(function (id) { return presence[id] && presence[id].online; }).length; }
function stateOf(id) { var p = presence[id]; if (!p || !p.online) return 'off'; return p.visible ? 'on' : 'away'; }
function stateText(id) { var s = stateOf(id), st = S.students[id]; if (s === 'on') return 'online'; if (s === 'away') return 'tab in background'; return 'offline · ' + ago(st && st.lastSeen); }
function remember() { try { localStorage.setItem('klass.group', cur || ''); localStorage.setItem('klass.tab', tab); localStorage.setItem('klass.view', view); } catch (e) {} }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

function render() { $('#who').textContent = 'Signed in as ' + S.teacher.login; renderSide(); renderMain(); }
function pendingList() { return Object.values(S.students).filter(function (s) { return s.status === 'pending'; }).sort(function (a, b) { return a.createdAt - b.createdAt; }); }
function approved() { return Object.values(S.students).filter(function (s) { return s.status !== 'pending'; }).sort(function (a, b) { return a.name.localeCompare(b.name); }); }
function renderReq() {
  var list = pendingList();
  var h = '<div class="gh"><div><div class="label">Telegram sign-in</div><h1>Requests</h1></div></div><div class="stack"><p class="hint">Students who signed in with Telegram and wrote their name. Approve them and, if you like, put them into a group straight away. You can also approve from Telegram — the bot sends you a message with buttons.</p>';
  if (!list.length) h += '<div class="empty">No new requests.</div>';
  list.forEach(function (st) {
    h += '<div class="reqrow" data-st="' + st.id + '"><div class="nm"><b>' + esc(st.name) + '</b><div class="small muted">' + (st.tg ? (/^id /.test(st.tg) ? 'Telegram ' + esc(st.tg) : '@' + esc(st.tg)) + ' · ' : '') + ago(st.createdAt) + '</div></div>' +
      '<select aria-label="Group"><option value="">No group yet</option>' + S.groups.map(function (g) { return '<option value="' + g.id + '">' + esc(g.name) + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm primary" data-a="approve" type="button">Approve</button><button class="btn sm ghost danger" data-a="reject" type="button">Decline</button></div>';
  });
  $('#main').innerHTML = h + '</div>';
}
function renderSide() {
  $('#libBtn').classList.toggle('cur', view === 'lib'); $('#libCount').textContent = S.library.length || '';
  var np = pendingList().length; $('#reqBtn').hidden = !np && view !== 'req'; $('#reqBtn').classList.toggle('cur', view === 'req'); $('#reqCount').textContent = np || '';
  $('#glist').innerHTML = S.groups.length ? S.groups.map(function (g) {
    var on = onlineCount(g);
    return '<button class="gbtn' + (view === 'group' && g.id === cur ? ' cur' : '') + '" data-g="' + g.id + '" type="button"><span class="dot' + (on ? ' on' : '') + '"></span><span class="gn">' + esc(g.name) + '</span><span class="gc">' + on + '/' + g.studentIds.length + '</span></button>';
  }).join('') : '<span class="muted small" style="padding:0 8px">No groups yet</span>';
}
function renderMain() {
  var m = $('#main');
  if (view === 'lib') return renderLib();
  if (view === 'req') return renderReq();
  var g = G();
  if (!g) { m.innerHTML = '<div class="empty"><h2 style="font-size:17px">Create your first group</h2><p>Type a name on the left, e.g. “B1 evening” or “Anna 1:1”. Each group has its own students and lessons.</p></div>'; return; }
  var on = onlineCount(g);
  m.innerHTML = '<div class="gh"><div><div class="label">Group</div><h1>' + esc(g.name) + '</h1></div>' +
    '<div class="acts"><button class="btn sm" data-a="renameGroup" type="button">Rename</button><button class="btn sm danger" data-a="deleteGroup" type="button">Delete group</button></div></div>' +
    '<div class="tabs" role="tablist">' + tabBtn('boards', 'Boards' + (on ? '<span class="n">' + on + ' online</span>' : '')) + tabBtn('students', 'Students · ' + g.studentIds.length) + tabBtn('journal', 'Journal') + '</div><section id="tabBody"></section>';
  renderTab();
}
function tabBtn(id, label) { return '<button class="tab' + (tab === id ? ' cur' : '') + '" data-tab="' + id + '" role="tab" type="button">' + label + '</button>'; }
function renderTab() { var b = $('#tabBody'); if (!b) return; if (tab !== 'students' && tab !== 'journal') tab = 'boards'; b.innerHTML = tab === 'students' ? studentsHtml() : tab === 'journal' ? '<div id="jBody"><p class="muted">Loading…</p></div>' : boardsHtml(); if (tab === 'journal') loadJournal(); }

/* journal: lesson balance and attendance */
var J = null, Jg = null;
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function loadJournal() { var g = G(); if (!g) return; try { var j = await api('GET', '/api/t/groups/' + g.id + '/journal'); if (G() && G().id === g.id) { J = j; Jg = g.id; renderJournal(); } } catch (e) { toast(e.message); } }
async function saveJournal() { var gid = Jg; try { J = await api('PUT', '/api/t/groups/' + gid + '/journal', J); if (Jg === gid) renderJournal(); } catch (e) { toast(e.message); } }
function used(r) { return J.entries.reduce(function (a, e) { return a + (e.att[r.id] === 'p' || e.att[r.id] === 'ac' ? 1 : 0); }, 0); }
function topped(r) { return r.topups.reduce(function (a, t) { return a + t.n; }, 0); }
function balance(r) { return Math.round((r.start + topped(r) - used(r)) * 100) / 100; }
function fmtDate(d) { if (!d) return ''; var p = d.split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0].slice(2) : d; }
var ATT = { p: ['✓', 'was there — 1 lesson charged'], a: ['✗', 'absent — not charged'], ac: ['✗ ₽', 'absent — charged anyway'] };
function renderJournal() {
  var b = $('#jBody'); if (!b || !J) return;
  var g = G(), inJ = J.rows.map(function (r) { return r.sid; }), missing = g.studentIds.filter(function (id) { return S.students[id] && inJ.indexOf(id) < 0; });
  var h = '<div class="stack"><p class="hint">Write each student’s balance (lessons paid) once. After every lesson add the topic and mark who was there — one lesson is taken from everyone marked present. Click a mark in the history to change it; balances recalculate.</p>';
  h += '<div class="tablewrap"><table class="jt"><thead><tr><th>Name</th><th>Start balance</th><th>Topped up</th><th>Attended</th><th>Lessons left</th><th></th></tr></thead><tbody>' +
    (J.rows.length ? J.rows.map(function (r) {
      var bl = balance(r);

    if (a === 'share') { shareDialog(eid); return; }
    if (a === 'renameGroup') { var n = prompt('Group name', g.name); if (n && n.trim()) { await api('PATCH', '/api/t/groups/' + g.id, { name: n }); await load(); } }
    else if (a === 'deleteGroup') { if (confirm('Delete “' + g.name + '” with all its lessons, tasks and answers? Student accounts stay.')) { await api('DELETE', '/api/t/groups/' + g.id); cur = null; await load(); } }
    else if (a === 'renameLesson') { var t = prompt('Lesson name', S.lessons[lid].title); if (t && t.trim()) { await api('PATCH', '/api/t/lessons/' + lid, { title: t }); await load(); } }
    else if (a === 'deleteLesson') { if (confirm('Delete lesson “' + S.lessons[lid].title + '” with all tasks and answers?')) { await api('DELETE', '/api/t/lessons/' + lid); await load(); } }
    else if (a === 'lUp' || a === 'lDown') { await api('PATCH', '/api/t/lessons/' + lid, { move: a === 'lUp' ? 'up' : 'down' }); await load(); }
    else if (a === 'bLeft' || a === 'bRight') { await api('PATCH', '/api/t/exercises/' + eid, { move: a === 'bLeft' ? 'up' : 'down' }); await load(); }
    else if (a === 'fromLib') {
      var lib = S.library.map(function (x) { return S.exercises[x]; }).filter(Boolean);
      if (!lib.length) { toast('My boards is empty'); return; }
      modal('<h2 style="font-size:17px">Add from My boards</h2><p class="small muted" style="margin:0">A copy goes into this group — your original stays in My boards.</p><div style="max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:2px">' + lib.map(function (x) { return '<label class="chk"><input type="checkbox" value="' + x.id + '"> ' + esc(x.title) + '</label>'; }).join('') + '</div><div class="row"><button class="btn primary" data-m="go" type="button">Add</button><button class="btn ghost" data-m="close" type="button">Cancel</button></div>', async function (ev, mm) {
        if (!ev.target.closest('[data-m=go]')) return;
        var ids = $$('input:checked', mm).map(function (c) { return c.value; }); if (!ids.length) return;
        var dl = await defLesson(G());
        for (var k = 0; k < ids.length; k++) await api('POST', '/api/t/exercises/' + ids[k] + '/copy', { lessonId: dl });
        mm.remove(); toast('Added: ' + plural(ids.length, 'board')); await load();
      });
    }
    else if (a === 'exUp' || a === 'exDown') { await api('PATCH', '/api/t/exercises/' + eid, { move: a === 'exUp' ? 'up' : 'down' }); await load(); }
    else if (a === 'renameEx') { var et = prompt('Name', S.exercises[eid].title); if (et && et.trim()) { await api('PATCH', '/api/t/exercises/' + eid, { title: et }); await load(); } }
    else if (a === 'deleteEx') { if (confirm('Delete “' + S.exercises[eid].title + '” and all answers to it?')) { await api('DELETE', '/api/t/exercises/' + eid); await load(); } }
    else if (a === 'newBoard') { var bt = prompt('Board name', 'Board'); if (bt && bt.trim()) { var nb = await api('POST', '/api/t/lessons/' + lid + '/boards', { title: bt }); openLessons[lid] = true; await load(); window.open('/b/' + nb.id, '_blank'); } }
    else if (a === 'copyEx') {
      if ($('.copyrow', eEl)) return;
      var cr = document.createElement('span'); cr.className = 'row copyrow';
      cr.innerHTML = '<select aria-label="Copy to">' + lessonOptions(S.exercises[eid].kind === 'board') + '</select><button class="btn sm primary" data-a="copyGo" type="button">Copy</button>';
      ($('.row', eEl) || eEl).appendChild(cr);
    }
    else if (a === 'copyGo') { var target = $('.copyrow select', eEl).value; await api('POST', '/api/t/exercises/' + eid + '/copy', { lessonId: target }); toast('Copied'); if (target !== '__lib') openLessons[target] = true; await load(); }
    else if (a === 'push') pushTo(eid);
    else if (a === 'pushSel') pushTo($('#pushSel').value);
    else if (a === 'pushOne') { socket.emit('push', { exerciseId: D.exId, studentId: D.sid }); toast('Opened for the student: ' + exTitle(D.exId)); }
    else if (a === 'closeDrawer') closeDrawer();
    else if (a === 'blockSt') { var blk = S.students[sid].status !== 'blocked'; if (!blk || confirm('Block ' + S.students[sid].name + '? They are signed out right away and can\'t sign in until you unblock them.')) { await api('POST', '/api/t/students/' + sid + '/block', { block: blk }); await load(); } }
    else if (a === 'linkSt') linkDialog(sid);
    else if (a === 'renameSt') { var sn = prompt('Student name', S.students[sid].name); if (sn && sn.trim()) { await api('PATCH', '/api/t/students/' + sid, { name: sn }); await load(); } }
    else if (a === 'resetPw') { var np = genPass(); if (confirm('Set a new password for ' + S.students[sid].name + ': ' + np + '? The old one stops working.')) { await api('PATCH', '/api/t/students/' + sid, { password: np }); cred = credText(S.students[sid].name, S.students[sid].login, np); await load(); } }
    else if (a === 'removeSt') { if (confirm('Remove ' + S.students[sid].name + ' from this group? Account and answers are kept.')) { await api('DELETE', '/api/t/groups/' + g.id + '/members/' + sid); await load(); } }
    else if (a === 'deleteSt') { if (confirm('Delete ' + S.students[sid].name + '’s account and all their answers in every group?')) { await api('DELETE', '/api/t/students/' + sid); if (D.sid === sid) closeDrawer(); await load(); } }
    else if (a === 'copyCred') { try { await navigator.clipboard.writeText(cred); toast('Copied'); } catch (err) { var r = document.createRange(); r.selectNodeContents($('#credText')); getSelection().removeAllRanges(); getSelection().addRange(r); } }
    else if (a === 'hideCred') { cred = null; renderTab(); }
  } catch (err) { toast(err.message); }
});
function pushTo(eid) { socket.emit('push', { exerciseId: eid }); toast('“' + exTitle(eid) + '” opened for everyone online'); }
document.addEventListener('toggle', function (e) { if (e.target.matches && e.target.matches('details.lesson')) openLessons[e.target.dataset.l] = e.target.open; }, true);
document.addEventListener('change', async function (e) {
  var t = e.target;
  if (t.id === 'dEx') { D.exId = t.value; D.follow = false; D.data = null; renderDrawer(); loadDetail(); return; }
  if (t.id === 'dFollow') { D.follow = t.checked; return; }
  if (t.dataset.a === 'upload') {
    var lid = t.closest('[data-l]').dataset.l, files = Array.prototype.slice.call(t.files), ok = 0;
    for (var i = 0; i < files.length; i++) { try { var html = await files[i].text(); var title = (/<title[^>]*>([^<]*)<\/title>/i.exec(html) || [])[1] || files[i].name.replace(/\.html?$/i, ''); await api('POST', '/api/t/lessons/' + lid + '/exercises', { title: title.trim(), html: html }); ok++; } catch (err) { toast(files[i].name + ': ' + err.message); } }
    openLessons[lid] = true; if (ok) toast('Uploaded: ' + plural(ok, 'task')); await load(); return;
  }
  if (t.dataset.a === 'uploadBoard' || t.id === 'libImport') {
    var blid = t.id === 'libImport' ? null : t.closest('[data-l]').dataset.l; if (blid === '__def') blid = await defLesson(G());
    var bf = Array.prototype.slice.call(t.files), bok = 0;
    for (var j = 0; j < bf.length; j++) {
      try { var data = JSON.parse(await bf[j].text()); var ttl = data.title || bf[j].name.replace(/\.json$/i, ''); if (blid) await api('POST', '/api/t/lessons/' + blid + '/boards', { title: ttl, data: data }); else await api('POST', '/api/t/library/boards', { title: ttl, data: data, folderId: folder }); bok++; }
      catch (err) { toast(bf[j].name + ': ' + (err instanceof SyntaxError ? 'not a board file' : err.message)); }
    }
    if (blid) openLessons[blid] = true; if (bok) toast('Boards uploaded: ' + bok); await load(); return;
  }
  if (t.dataset.a === 'coverEx' && t.files[0]) {
    var ceid = t.closest('[data-e]').dataset.e;
    try { toast('Uploading the cover…'); var curl = await uploadImage(t.files[0]); await api('PATCH', '/api/t/exercises/' + ceid, { cover: curl }); await load(); } catch (err) { toast(err.message); }
    t.value = ''; return;
  }
  if (t.id === 'newLibCover') { $('#newLibCoverName').textContent = t.files[0] ? t.files[0].name : ''; return; }
  if (t.dataset.a === 'replaceEx') { var eid = t.closest('[data-e]').dataset.e; try { await api('PATCH', '/api/t/exercises/' + eid, { html: await t.files[0].text() }); toast('File replaced'); } catch (err) { toast(err.message); } t.value = ''; }
});
document.addEventListener('submit', async function (e) {
  e.preventDefault(); var f = e.target;
  try {
    if (f.id === 'newGroup') { var name = $('#newGroupName').value.trim(); if (!name) return; var g = await api('POST', '/api/t/groups', { name: name }); $('#newGroupName').value = ''; cur = g.id; view = 'group'; tab = 'students'; remember(); await load(); }
    else if (f.id === 'newLesson') { var title = $('#newLessonTitle').value.trim(); if (!title) return; var l = await api('POST', '/api/t/groups/' + cur + '/lessons', { title: title }); openLessons[l.id] = true; await load(); }
    else if (f.id === 'newLib') { var lt = $('#newLibTitle').value.trim() || 'My board'; var nb = await api('POST', '/api/t/library/boards', { title: lt, folderId: folder }); var cf = $('#newLibCover').files[0]; if (cf) { try { await api('PATCH', '/api/t/exercises/' + nb.id, { cover: await uploadImage(cf) }); } catch (err) { toast(err.message); } } await load(); window.open('/b/' + nb.id, '_blank'); }
    else if (f.id === 'newStudent') { var n = $('#nsName').value.trim(), lg = $('#nsLogin').value.trim(), pw = $('#nsPass').value; await api('POST', '/api/t/students', { name: n, login: lg, password: pw, groupId: cur }); cred = credText(n, lg, pw); await load(); }
    else if (f.id === 'addExisting') { await api('POST', '/api/t/groups/' + cur + '/members', { studentId: $('#exStudent').value }); await load(); }
    else if (f.id === 'pwForm') { await api('POST', '/api/t/password', { old: $('#pwOld').value, password: $('#pwNew').value }); $('#pwOld').value = ''; $('#pwNew').value = ''; toast('Password changed'); }
  } catch (err) { toast(err.message); }
});
$('#logout').addEventListener('click', async function () { await api('POST', '/api/logout'); location.href = '/'; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && D.sid) closeDrawer(); });

/* realtime */
socket.on('boards-changed', function () { load(); });
socket.on('requests', function () { load().then(function () { var n = pendingList().length; if (n) toast('New sign-in request — see Requests', function () { view = 'req'; render(); }); }); });
socket.on('presence-all', function (list) { list.forEach(function (p) { presence[p.studentId] = p; }); if (S) refreshLive(); });
socket.on('presence', function (p) {
  var was = presence[p.studentId]; presence[p.studentId] = p;
  if (!S) return;
  if (D.sid === p.studentId && D.follow && p.online && p.exerciseId && p.exerciseId !== D.exId) { D.exId = p.exerciseId; D.data = null; loadDetail(); }
  if (view === 'group' && tab === 'students' && (!was || was.online !== p.online)) renderTab();
  refreshLive();
});
socket.on('progress', function (d) {
  if (!S) return;
  var p = d.prog;
  S.summaries[d.studentId + ':' + d.exerciseId] = { filled: p.filled, total: p.total, correct: p.correct, wrong: p.wrong, scroll: p.scroll, near: p.near, action: p.action, updatedAt: p.updatedAt };
  if (D.sid === d.studentId && D.exId === d.exerciseId && D.data) {
    D.data.prog = p;
    var notesHtml = dNotes && document.activeElement === dNotes.el ? null : D.data.doc;
    var body = $('#drawer .dbody'), sc = body ? body.scrollTop : 0;
    if (!(dNotes && document.activeElement === dNotes.el)) { renderDrawer(); var b2 = $('#drawer .dbody'); if (b2) b2.scrollTop = sc; }
  }
  refreshLive();
});
socket.on('doc', function (d) {
  if (D.sid === d.studentId && D.exId === d.exerciseId && D.data) { D.data.doc = d.html; if (dNotes && d.by === 's') dNotes.set(d.html); }
  else if (d.by === 's' && S && S.students[d.studentId] && view === 'group') { /* quiet: notes are visible when you open the student */ }
});
setInterval(function () { if (S) refreshLive(); }, 20000);
load().catch(function (e) { toast(e.message); });
</script>
